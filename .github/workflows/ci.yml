name: Tests

on:
  push:
  # Allows running the workflow by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# A new push replaces the run still going on the same branch.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src tests
      - run: npm run test -- --run
